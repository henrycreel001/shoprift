<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoprift — Full Flow Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Tokens ── */
    :root {
      --page:        #F6F6F7;
      --surface:     #FFFFFF;
      --void:        #0A0B0F;
      --mint:        #00E5A0;
      --mint-hover:  #00CC8E;
      --mint-dark:   #007A52;
      --portal:      #6B8AFF;
      --ink:         #1A1A1A;
      --ink-2:       #4A4F54;
      --ink-3:       #6D7175;
      --ink-4:       #8C9196;
      --ink-5:       #C9CCCF;
      --wire:        #E1E3E5;
      --wire-s:      #F1F2F3;
      --wire-x:      #C9CCCF;
      --f-s:         'Inter', system-ui, sans-serif;
      --f-m:         'JetBrains Mono', ui-monospace, monospace;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--f-s); color: var(--ink); display: flex; height: 100vh; overflow: hidden; background: #DCDCDD; }

    /* ── Sidebar ── */
    #sb {
      width: 218px;
      flex-shrink: 0;
      background: #111214;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .sb-hd {
      padding: 16px 14px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .sb-logo { font-family: var(--f-m); font-size: 12px; font-weight: 600; color: var(--mint); letter-spacing: 0.08em; display: block; }
    .sb-sub  { font-family: var(--f-m); font-size: 8.5px; color: rgba(255,255,255,0.25); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; display: block; }
    #sb-nav  { flex: 1; overflow-y: auto; padding: 6px 0 12px; }
    #sb-nav::-webkit-scrollbar { width: 3px; }
    #sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    .sb-grp  { font-family: var(--f-m); font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em; color: rgba(255,255,255,0.22); padding: 10px 14px 3px; }
    .sb-btn  {
      display: block; width: 100%; text-align: left; padding: 6px 14px;
      font-family: var(--f-s); font-size: 12px; color: rgba(255,255,255,0.48);
      background: none; border: none; cursor: pointer; transition: all 0.1s;
    }
    .sb-btn:hover  { color: rgba(255,255,255,0.82); background: rgba(255,255,255,0.04); }
    .sb-btn.active { color: var(--mint); background: rgba(0,229,160,0.08); font-weight: 500; }
    .sb-ft { padding: 10px 14px; font-family: var(--f-m); font-size: 9px; color: rgba(255,255,255,0.18); border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* Shopify admin bar */
    #sf-bar {
      background: #1C1C1C; color: rgba(255,255,255,0.55); font-size: 11px;
      padding: 0 18px; height: 34px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0; font-family: var(--f-s);
    }
    .sf-store { display: flex; align-items: center; gap: 7px; }
    .sf-dot   { width: 6px; height: 6px; border-radius: 50%; background: #4CAF50; flex-shrink: 0; }
    .sf-app   { font-size: 10.5px; color: rgba(255,255,255,0.28); }

    /* Content scroll */
    #scroll { flex: 1; overflow-y: auto; padding: 20px; }

    /* App card */
    .card {
      max-width: 592px; margin: 0 auto;
      background: var(--page); border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10), 0 6px 20px rgba(0,0,0,0.06);
    }
    .card-inner { padding: 32px 24px 80px; }

    /* Bottom nav */
    #bot {
      background: #DCDCDD; padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.09);
    }
    .nav-b {
      font-family: var(--f-s); font-size: 12px; font-weight: 500;
      color: var(--ink-2); background: #fff; border: 1px solid var(--wire);
      border-radius: 6px; padding: 5px 14px; cursor: pointer; transition: all 0.1s;
    }
    .nav-b:hover   { border-color: var(--ink-4); color: var(--ink); }
    .nav-b:disabled { opacity: 0.3; cursor: default; }
    #lbl { font-family: var(--f-m); font-size: 10.5px; color: var(--ink-4); text-align: center; flex: 1; padding: 0 12px; }
    #lbl strong { color: var(--ink-2); }

    /* ════════════════════════════════════════════
       APP COMPONENT STYLES — matches migrate/page.tsx
       ════════════════════════════════════════════ */

    /* Step track */
    .st { display: flex; align-items: flex-start; margin-bottom: 40px; }
    .si { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
    .sd { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
    .sd.dn { background: #ECFDF5; border: 1px solid rgba(0,229,160,0.4); }
    .sd.ac { background: var(--mint); box-shadow: 0 0 0 3px rgba(0,229,160,0.20); }
    .sd.ft { background: var(--wire-s); border: 1px solid var(--wire); }
    .sn { font-family: var(--f-m); font-size: 9px; font-weight: 700; line-height: 1; }
    .sd.ac .sn { color: var(--void); }
    .sd.ft .sn { color: var(--ink-4); }
    .sl { font-family: var(--f-m); font-size: 8px; letter-spacing: 0.09em; text-transform: uppercase; white-space: nowrap; }
    .sl.dn { color: var(--ink-3); }
    .sl.ac { color: var(--ink); font-weight: 600; }
    .sl.ft { color: var(--ink-5); }
    .sc { flex: 1; height: 1px; margin: 10px 4px 0; }
    .sc.dn { background: rgba(0,229,160,0.35); }
    .sc.ft { background: var(--wire-x); }

    /* Row label */
    .rl { font-family: var(--f-m); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); margin-bottom: 6px; }

    /* Alerts */
    .al { display: flex; align-items: flex-start; gap: 12px; border-radius: 12px; padding: 12px 16px; margin-bottom: 24px; }
    .ad { width: 4px; height: 4px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
    .al-w { border: 1px solid #FDE68A; background: #FFFBEB; }
    .al-w .ad { background: #F59E0B; }
    .al-w p { font-family: var(--f-m); font-size: 11px; color: #92400E; line-height: 1.6; }
    .al-e { border: 1px solid #FECACA; background: #FEF2F2; }
    .al-e .ad { background: #EF4444; }
    .al-e p { font-family: var(--f-m); font-size: 11px; color: #DC2626; line-height: 1.6; }
    .al-o { border: 1px solid #A7F3D0; background: #ECFDF5; }
    .al-o .ad { background: #10B981; }
    .al-o p { font-family: var(--f-m); font-size: 11px; color: #065F46; line-height: 1.6; }

    /* Input */
    .fl  { display: block; font-family: var(--f-m); font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); margin-bottom: 8px; }
    .inp {
      width: 100%; background: var(--surface); border-radius: 12px;
      padding: 14px 16px; font-family: var(--f-m); font-size: 13.5px;
      color: var(--ink); border: 1px solid var(--wire-x); outline: none;
    }
    .inp::placeholder { color: var(--ink-5); }
    .inp.err { border-color: #FCA5A5; }
    .em { margin-top: 8px; font-family: var(--f-m); font-size: 11px; color: #EF4444; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 8px; font-family: var(--f-s); font-weight: 500; font-size: 14px;
      padding: 10px 20px; cursor: default; border: none; outline: none; text-decoration: none;
      transition: none;
    }
    .btn-lg  { padding: 13px 20px; font-size: 15px; }
    .btn-sm  { padding: 7px 14px; font-size: 12px; }
    .btn-w   { width: 100%; }
    .btn-p   { background: var(--mint); color: var(--void); font-weight: 600; box-shadow: 0 1px 3px rgba(0,229,160,0.25); }
    .btn-s   { background: var(--surface); color: var(--ink-2); border: 1px solid var(--wire-x); }
    .btn-g   { background: none; color: var(--ink-4); border: none; padding: 6px 8px; }
    .btn-ld  { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sp  { width: 13px; height: 13px; border: 1.5px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
    .sp2 { width: 12px; height: 12px; border: 1.5px solid var(--wire); border-top-color: var(--mint); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }

    /* Stats bar */
    .sb2 { display: flex; border: 1px solid var(--wire); border-radius: 12px; overflow: hidden; margin-bottom: 28px; }
    .sc2 { flex: 1; padding: 16px 20px; background: var(--surface); }
    .sc2 + .sc2 { border-left: 1px solid var(--wire); }
    .sn2 { font-family: var(--f-m); font-size: 30px; font-weight: 500; color: var(--ink); line-height: 1; margin-bottom: 4px; }
    .sn2.ac { color: var(--mint-dark); }
    .sn2.rd { color: #EF4444; }
    .sl2 { font-family: var(--f-m); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.11em; color: var(--ink-4); }
    .sl2.rd { color: #F87171; }

    /* Price row */
    .pr { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 24px; margin-bottom: 20px; border-bottom: 1px solid var(--wire-s); }
    .pb { font-family: var(--f-m); font-size: 26px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em; }

    /* Data table */
    .dt { border: 1px solid var(--wire); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
    .dr { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--wire-s); }
    .dr:last-child { border-bottom: none; }
    .drl { font-size: 14px; color: var(--ink-3); }
    .drl.dm { color: var(--ink-5); }
    .drv { font-family: var(--f-m); font-size: 14px; font-weight: 500; color: var(--ink); }
    .drv.ac { color: var(--mint-dark); }
    .drv.dm { color: var(--ink-5); }

    /* Product preview */
    .pp { border: 1px solid var(--wire-s); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .ppr { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid #F4F4F4; }
    .ppr:last-child { border-bottom: none; }
    .ppn { font-size: 14px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 16px; }
    .ppp { font-family: var(--f-m); font-size: 12px; color: var(--ink-4); flex-shrink: 0; }

    /* Progress */
    .pgw { position: relative; height: 5px; background: var(--wire); border-radius: 99px; overflow: hidden; }
    .pgb { position: absolute; inset-block: 0; left: 0; background: var(--mint); border-radius: 99px; }
    .pgm { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .pgmsg { font-family: var(--f-m); font-size: 11px; color: var(--ink-4); }
    .pgpct { font-family: var(--f-m); font-size: 11px; color: var(--ink-3); }

    /* Timeline */
    .tl { list-style: none; margin-bottom: 32px; }
    .tli { display: flex; gap: 16px; position: relative; }
    .tdw { flex-shrink: 0; position: relative; }
    .tdw::after { content: ''; position: absolute; left: 8px; top: 19px; bottom: 0; width: 1px; background: var(--wire); }
    .tli:last-child .tdw::after { display: none; }
    .td { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--wire-x); display: flex; align-items: center; justify-content: center; margin-top: 2px; background: var(--surface); position: relative; z-index: 1; }
    .td span { font-family: var(--f-m); font-size: 8.5px; color: var(--ink-4); }
    .tt { font-size: 14.5px; color: var(--ink-2); padding-bottom: 18px; line-height: 1.45; }

    /* Code box */
    .cb { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface); border: 1px solid var(--wire); border-radius: 12px; padding: 16px 20px; }
    .cv { font-family: var(--f-m); font-size: 21px; color: var(--mint-dark); letter-spacing: 0.06em; word-break: break-all; }
    .cp { flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-family: var(--f-m); font-size: 11px; color: var(--ink-4); background: none; border: none; }
    .cm { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .ch { font-family: var(--f-m); font-size: 10px; color: var(--ink-5); }
    .ce { font-family: var(--f-m); font-size: 10px; color: var(--ink-5); flex-shrink: 0; margin-left: 12px; }
    .ce.xp { color: #F87171; }

    /* Verify error box */
    .veb { margin-bottom: 20px; border-radius: 12px; border: 1px solid #FECACA; background: #FEF2F2; padding: 12px 16px; }
    .veb p { font-family: var(--f-m); font-size: 11px; color: #DC2626; }

    /* Check badge */
    .chk { display: flex; align-items: center; gap: 8px; font-family: var(--f-m); font-size: 12px; color: var(--mint-dark); margin-bottom: 20px; }

    /* Err list */
    .el  { border: 1px solid var(--wire-s); border-radius: 12px; overflow: hidden; }
    .elh { padding: 12px 20px; font-family: var(--f-m); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--ink-4); }
    .eli { padding: 10px 20px; font-family: var(--f-m); font-size: 11px; color: #F87171; border-top: 1px solid #F4F4F4; }

    /* Footer */
    .ft { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--wire-s); display: flex; gap: 20px; flex-wrap: wrap; }
    .ft a { font-family: var(--f-m); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-4); text-decoration: none; }

    /* Utilities */
    .row { display: flex; align-items: center; gap: 12px; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .ctr { display: flex; justify-content: center; }
    .lp  { color: var(--portal); text-decoration: none; }
    .h1  { font-size: 29px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink); line-height: 1.2; margin-bottom: 12px; }
    .h2  { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; color: var(--ink); line-height: 1.25; margin-bottom: 6px; }
    .sub { font-size: 15px; color: var(--ink-3); line-height: 1.65; }
    .mono11 { font-family: var(--f-m); font-size: 11px; }
    .mono10 { font-family: var(--f-m); font-size: 10px; }
  </style>
</head>
<body>

<aside id="sb">
  <div class="sb-hd">
    <span class="sb-logo">SHOPRIFT</span>
    <span class="sb-sub">Flow Review — 26 screens</span>
  </div>
  <nav id="sb-nav"></nav>
  <div class="sb-ft">← → arrow keys to navigate</div>
</aside>

<div id="main">
  <div id="sf-bar">
    <div class="sf-store">
      <span class="sf-dot"></span>
      <span>Kiwi Boutique · kiwiiboutique.myshopify.com</span>
    </div>
    <span class="sf-app">Shoprift</span>
  </div>
  <div id="scroll">
    <div class="card">
      <div class="card-inner" id="content"></div>
    </div>
    <div style="height:20px"></div>
  </div>
  <div id="bot">
    <button class="nav-b" id="pbtn" onclick="nav(-1)">← Prev</button>
    <span id="lbl"></span>
    <button class="nav-b" id="nbtn" onclick="nav(1)">Next →</button>
  </div>
</div>

<script>
// ── Icons ─────────────────────────────────────────────────────────────────────
const CHK = `<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5l3 3 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
const ARR = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 6.5h9M7.5 3l3.5 3.5L7.5 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
const CPY = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 8.5H2.5a1 1 0 01-1-1V2.5a1 1 0 011-1h5a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`

// ── Step track ─────────────────────────────────────────────────────────────────
// activeIdx: 0=URL 1=Verify 2=Preview 3=Extract 4=Review 5=Import 6=Done
const SLBLS = ['URL','Verify','Preview','Extract','Review','Import','Done']
function ST(ai) {
  let h = '<nav class="st">'
  SLBLS.forEach((lbl, i) => {
    const dn = i < ai, ac = i === ai, ft = i > ai
    const cls = dn ? 'dn' : ac ? 'ac' : 'ft'
    h += `<div class="si">
      <div class="sd ${cls}">${dn ? `<span style="color:var(--mint-dark);display:flex">${CHK}</span>` : `<span class="sn">${i+1}</span>`}</div>
      <span class="sl ${cls}">${lbl}</span>
    </div>`
    if (i < 6) h += `<div class="sc ${i < ai ? 'dn' : 'ft'}"></div>`
  })
  return h + '</nav>'
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const AW = t => `<div class="al al-w"><div class="ad"></div><p>${t}</p></div>`
const AE = t => `<div class="al al-e"><div class="ad"></div><div><p>${t}</p><p class="mono10" style="color:var(--ink-4);margin-top:6px">Need help? <a href="mailto:support@shoprift.app" class="lp">support@shoprift.app</a></p></div></div>`
const AO = t => `<div class="al al-o"><div class="ad"></div><p>${t}</p></div>`
const PB = p => `<div class="pgw"><div class="pgb" style="width:${p}%"></div></div>`
const FT = `<div class="ft"><a href="#">Terms</a><a href="#">Privacy</a><a href="#">Refunds</a><a href="#">Grievance Officer</a></div>`
const TL_STEPS = ['Log in to your dm2buy seller dashboard.','Go to Products → Add Product.','Set the product name to exactly the code below.','Save — draft status is fine.','Click "Verify now" below.']
const TL = TL_STEPS.map((t,i)=>`<li class="tli"><div class="tdw"><div class="td"><span>${i+1}</span></div></div><p class="tt">${t}</p></li>`).join('')

// ── Screens ───────────────────────────────────────────────────────────────────
const screens = [

  // ─── ENTRY ──────────────────────────────────────────────────────────────────

  { id:'url', label:'URL Input (empty)', group:'Entry', c: () => `
    ${ST(0)}
    <div style="margin-bottom:36px">
      <p class="rl" style="font-size:10px;letter-spacing:0.16em;color:var(--ink-4);margin-bottom:12px">dm2buy → Shopify</p>
      <h1 class="h1">Move your store.</h1>
      <p class="sub" style="max-width:40ch">Products, images, and collections land directly in your Shopify admin. No CSV. No re-entering data.</p>
    </div>
    <div style="margin-bottom:16px">
      <label class="fl">Store URL</label>
      <input class="inp" type="url" placeholder="https://yourstore.dm2buy.com" readonly />
    </div>
    <button class="btn btn-p btn-lg btn-w">Check store ${ARR}</button>
    ${FT}
  `},

  { id:'reconning', label:'Scanning…', group:'Entry', c: () => `
    ${ST(0)}
    <div style="margin-bottom:36px">
      <p class="rl" style="font-size:10px;letter-spacing:0.16em;color:var(--ink-4);margin-bottom:12px">dm2buy → Shopify</p>
      <h1 class="h1">Move your store.</h1>
      <p class="sub" style="max-width:40ch">Products, images, and collections land directly in your Shopify admin. No CSV. No re-entering data.</p>
    </div>
    <div style="margin-bottom:16px">
      <label class="fl">Store URL</label>
      <input class="inp" type="url" value="https://kiwiishop.dm2buy.com" disabled style="opacity:0.5" />
    </div>
    <button class="btn btn-p btn-lg btn-w btn-ld"><span class="sp"></span> Scanning...</button>
    ${FT}
  `},

  { id:'reconning-acct', label:'Checking account…', group:'Entry', c: () => `
    ${ST(0)}
    <div style="margin-bottom:36px">
      <p class="rl" style="font-size:10px;letter-spacing:0.16em;color:var(--ink-4);margin-bottom:12px">dm2buy → Shopify</p>
      <h1 class="h1">Move your store.</h1>
      <p class="sub" style="max-width:40ch">Products, images, and collections land directly in your Shopify admin. No CSV. No re-entering data.</p>
    </div>
    <div style="margin-bottom:16px">
      <label class="fl">Store URL</label>
      <input class="inp" type="url" value="https://kiwiishop.dm2buy.com" disabled style="opacity:0.5" />
    </div>
    <button class="btn btn-p btn-lg btn-w btn-ld"><span class="sp"></span> Checking account...</button>
    ${FT}
  `},

  { id:'url-err', label:'URL Validation Error', group:'Entry', c: () => `
    ${ST(0)}
    <div style="margin-bottom:36px">

// ── Nav ───────────────────────────────────────────────────────────────────────
let cur = 0

function buildSidebar() {
  const el = document.getElementById('sb-nav')
  let html = '', lastGrp = ''
  screens.forEach((s, i) => {
    if (s.group !== lastGrp) {
      html += `<p class="sb-grp">${s.group}</p>`
      lastGrp = s.group
    }
    html += `<button class="sb-btn" id="sbi${i}" onclick="goto(${i})">${s.label}</button>`
  })
  el.innerHTML = html
}

function render() {
  const s = screens[cur]
  document.getElementById('content').innerHTML = s.c()
  document.getElementById('lbl').innerHTML = `<strong>${s.group}: ${s.label}</strong>&nbsp;&nbsp;${cur+1} / ${screens.length}`
  screens.forEach((_,i) => {
    const el = document.getElementById(`sbi${i}`)
    if (el) el.classList.toggle('active', i === cur)
  })
  const active = document.getElementById(`sbi${cur}`)
  if (active) active.scrollIntoView({ block:'nearest' })
  document.getElementById('scroll').scrollTop = 0
  document.getElementById('pbtn').disabled = cur === 0
  document.getElementById('nbtn').disabled = cur === screens.length - 1
}

function nav(d) { const n = cur + d; if (n >= 0 && n < screens.length) { cur = n; render() } }
function goto(i) { cur = i; render() }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nav(1)
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   nav(-1)
})

buildSidebar()
render()
</script>
</body>
</html>
